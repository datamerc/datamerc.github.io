  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0d1117; --panel:#161b22; --border:#30363d;
      --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
    }
    * { box-sizing:border-box }
    body {
      margin:0; font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg); color:var(--text);
    }
    main { width:min(1200px,calc(100% - 32px)); margin:40px auto 80px }
    h1 { margin:0; font-size:clamp(2rem,5vw,3.5rem); letter-spacing:-.04em }
    .lead { color:var(--muted); margin:8px 0 28px }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px }
    .card,.panel,details {
      background:var(--panel); border:1px solid var(--border); border-radius:12px;
    }
    .card { padding:18px }
    .label { color:var(--muted); font-size:.82rem; text-transform:uppercase; letter-spacing:.08em }
    .value { font-size:1.65rem; font-weight:700; margin-top:5px }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; margin-top:16px }
    .panel { padding:18px; min-width:0 }
    .panel h2 { margin:0 0 14px; font-size:1rem }
    .chart-wrap { height:320px }
    .results { display:grid; gap:12px; margin-top:16px }
    details { overflow:hidden }
    summary {
      padding:16px 18px; cursor:pointer; font-weight:700; display:flex;
      align-items:center; justify-content:space-between; gap:20px;
    }
    summary:hover { background:#1c2128 }
    .time { color:var(--accent); font-weight:600 }
    .table-wrap { overflow:auto; border-top:1px solid var(--border) }
    table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums }
    th,td { padding:9px 18px; border-bottom:1px solid var(--border); text-align:right }
    th:first-child,td:first-child { text-align:left }
    th { position:sticky; top:0; background:#1c2128; color:var(--muted); font-size:.78rem; text-transform:uppercase }
    td:last-child { font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
    footer { color:var(--muted); margin-top:24px; text-align:center }
    @media (max-width:780px) { .grid { grid-template-columns:1fr } .chart-wrap { height:280px } }
  </style>
</head>

<script>
const source = document.getElementById('raw-data').textContent.trim();
const chunks = source.split(/-{5,}/).map(s => s.trim()).filter(Boolean);

// Go's duration format prints only the units present, largest-to-smallest
// (e.g. "1h2m14.208548s", "45.923ms", "283µs"), with at most the smallest
// present unit carrying a fractional part. The alternation below tries
// 'µs'/'ms' before 'm'/'s' - otherwise "45.923ms" mismatches as 45.923
// minutes, since a naive left-to-right 'm' alternative matches the 'm' in
// "ms" first and strands the trailing "s".
function timeToMs(text) {
  let ms = 0;
  const re = /(\d+(?:\.\d+)?)(h|µs|ms|m|s)/g;
  let m;
  while ((m = re.exec(text))) {
    const n = Number(m[1]);
    ms += { h:3600000, m:60000, s:1000, ms:1, 'µs':0.001 }[m[2]] * n;
  }
  return ms;
}

const runs = chunks.map(chunk => {
  const pips = Number(chunk.match(/pips\s*=\s*(\d+)/)[1]);
  const time = chunk.match(/User CPU time used:\s*([^\n]+)/)[1].trim();
  const ramMb = Number(chunk.match(/Peak RAM change \(MaxRSS\):\s*(\d+) MB/)[1]);
  const rows = [...chunk.matchAll(/^\s*(\d+)\s+(\d+)\s*$/gm)]
    .map(m => ({ value:Number(m[1]), count:m[2] }));
  let peak = rows[0];
  for (const row of rows) {
    if (BigInt(row.count) > BigInt(peak.count)) peak = row;
  }
  return { pips, time, timeMs:timeToMs(time), ramMb, rows, peak };
});

const integer = value => BigInt(value).toLocaleString('en-US');
const formatRam = mb => mb >= 1024 ? `${(mb/1024).toFixed(1)} GB` : `${mb} MB`;

document.getElementById('cards').innerHTML = `
  <div class="card"><div class="label">Pips range</div><div class="value">${runs[0].pips}–${runs.at(-1).pips}</div></div>
  <div class="card"><div class="label">Fastest run</div><div class="value">${runs[0].time}</div></div>
  <div class="card"><div class="label">Slowest run</div><div class="value">${runs.at(-1).time}</div></div>
  <div class="card"><div class="label">Largest peak</div><div class="value">${integer(runs.at(-1).peak.count)}</div></div>
  <div class="card"><div class="label">Peak RAM (largest run)</div><div class="value">${formatRam(runs.at(-1).ramMb)}</div></div>
`;

document.getElementById('results').innerHTML = runs.map((run, i) => `
  <details ${i === runs.length - 1 ? 'open' : ''}>
    <summary>
      <span>Pips = ${run.pips}</span>
      <span><span class="time">${run.time}</span> · ${formatRam(run.ramMb)}</span>
    </summary>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Value</th><th>Count</th></tr></thead>
        <tbody>${run.rows.map(row =>
          `<tr><td>${row.value}</td><td>${integer(row.count)}</td></tr>`
        ).join('')}</tbody>
      </table>
    </div>
  </details>
`).join('');

Chart.defaults.color = '#8b949e';
Chart.defaults.borderColor = '#30363d';

new Chart(document.getElementById('timeChart'), {
  type:'line',
  data:{
    labels:runs.map(r => `pips ${r.pips}`),
    datasets:[{ label:'CPU time (ms)', data:runs.map(r => r.timeMs), tension:.25, pointRadius:5 }]
  },
  options:{
    maintainAspectRatio:false,
    plugins:{ legend:{ display:false } },
    scales:{
      y:{ type:'logarithmic', title:{ display:true, text:'Milliseconds — log scale' } },
      x:{ grid:{ display:false } }
    }
  }
});

new Chart(document.getElementById('peakChart'), {
  type:'bar',
  data:{
    labels:runs.map(r => `pips ${r.pips}`),
    datasets:[{ label:'Peak count (log₁₀)', data:runs.map(r => Math.log10(Number(r.peak.count))) }]
  },
  options:{
    maintainAspectRatio:false,
    plugins:{
      legend:{ display:false },
      tooltip:{ callbacks:{ label:ctx => 'Peak: ' + integer(runs[ctx.dataIndex].peak.count) } }
    },
    scales:{
      y:{ title:{ display:true, text:'log₁₀(count)' } },
      x:{ grid:{ display:false } }
    }
  }
});

new Chart(document.getElementById('ramChart'), {
  type:'line',
  data:{
    labels:runs.map(r => `pips ${r.pips}`),
    datasets:[{ label:'Peak RAM (MB)', data:runs.map(r => r.ramMb), tension:.25, pointRadius:5 }]
  },
  options:{
    maintainAspectRatio:false,
    plugins:{
      legend:{ display:false },
      tooltip:{ callbacks:{ label:ctx => 'Peak RAM: ' + formatRam(runs[ctx.dataIndex].ramMb) } }
    },
    scales:{
      y:{ type:'logarithmic', title:{ display:true, text:'MB — log scale' } },
      x:{ grid:{ display:false } }
    }
  }
});
</script>
